<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Targets · Clinical Compliance</title>
<link rel="preconnect" href="https://docs.google.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'">
<link rel="stylesheet" href="assets/style.css?v=2">
</head>
<body>
<script src="assets/core.js?v=2"></script>
<script src="assets/ui.js?v=2"></script>
<script>
UI.page({
  title: "Clinical Compliance · KPI Targets",
  subtitle: "Page 3 · 12 KPIs, each with a target and a traffic light",
  intro: "The monthly review view. Each KPI has a target; green means met, amber means within 10% of the target, red means missed. The headline is how many KPIs are on target.",
  render: function(c){
    var M=c.M, PM=c.PM, f1=UI.f1, esc=UI.esc, S=M.kpiStatus;
    var g=S.filter(function(x){ return x.st==="green"; }).length, a=S.filter(function(x){ return x.st==="amber"; }).length, r=S.filter(function(x){ return x.st==="red"; }).length, n=g+a+r;
    var rag = n ? (g/n>=0.8?"green":(g/n>=0.6?"amber":"red")) : "none";
    var h='<div class="banner '+rag+'"><div style="text-align:center"><div style="font-family:var(--font-mono);font-size:84px;font-weight:600;line-height:1">'+g+'<span style="font-size:32px;color:var(--ink-soft)">/'+n+'</span></div><div style="font-size:12px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;font-weight:700">KPIs on target</div></div>'+
      '<div class="headline"><div class="eyebrow">KPI scorecard · '+esc(c.p.label)+'</div><h2><span class="hl">'+g+' of '+n+'</span> KPIs met their target</h2>'+
      '<div class="sub"><span class="pill-st green">'+g+' on target</span><span class="pill-st amber">'+a+' close (within 10%)</span><span class="pill-st red">'+r+' missed</span>'+(PM?'<span>'+esc(c.pv.label)+': '+PM.kpiMet+' of '+PM.kpiTotal+'</span>':'')+'</div>'+
      '<div class="wf"><div class="wf-bar">'+(g?'<div class="seg" style="flex:'+g+';background:var(--band-green)">'+g+' green</div>':'')+(a?'<div class="seg" style="flex:'+a+';background:var(--band-amber)">'+a+' amber</div>':'')+(r?'<div class="seg" style="flex:'+r+';background:var(--band-red)">'+r+' red</div>':'')+'</div></div></div></div>';
    var hist=c.periods.map(function(p){ return APP.metrics(c.D,p.start,p.end); });
    var groups={}; S.forEach(function(x,i){ (groups[x.def.pillar]=groups[x.def.pillar]||[]).push({x:x,i:i}); });
    h+='<div class="section-label"><span class="n">01</span>All KPIs, by pillar</div><div class="panel"><div class="tbl-wrap"><table><thead><tr><th>KPI</th><th class="num">Actual</th><th class="num">Target</th><th>Status</th><th class="num">vs '+(PM?esc(c.pv.label):'previous')+'</th><th>By month</th></tr></thead><tbody>';
    Object.keys(groups).forEach(function(gname){
      h+='<tr><td colspan="6" style="background:var(--surface-2);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)">'+esc(gname)+'</td></tr>';
      groups[gname].forEach(function(o){ var x=o.x, d=x.def, pv=PM?PM.kpi[d.k]:null, isAudit=/audit|pass|critical|coverage|lead/i.test(d.k);
        var cmp = PM && (!isAudit || c.auditCmp) ? UI.delta(x.v,pv,d.unit==="%"?1:2,d.dir==="min",d.unit) : '<span class="delta flat">—</span>';
        var vals=hist.map(function(m){ return m.kpi[d.k]; });
        h+='<tr><td><b>'+esc(d.label)+'</b></td><td class="num"><b>'+f1(x.v,(d.unit==="%"&&d.target>=2)?1:2)+d.unit+'</b></td><td class="num">'+(d.dir==="min"?"&ge; ":"&le; ")+d.target+d.unit+'</td><td><span class="pill-st '+x.st+'">'+(x.st==="green"?"On target":x.st==="amber"?"Close":x.st==="red"?"Missed":"No data")+'</span></td><td class="num">'+cmp+'</td><td>'+UI.spark(vals,110,28)+' <span style="font-size:10.5px;color:var(--ink-soft)">'+c.periods.map(function(p){ return p.short.split(" ")[0]; }).join(" · ")+'</span></td></tr>'; });
    });
    h+='</tbody></table></div><p class="cfg-note">Targets are starting suggestions based on today\'s data and common practice. Amber = within 10% of target. Tell me your official targets and I will update them in one place.</p></div>';
    return h;
  },
  guide:
   '<div class="hcard"><h3><span class="no">A</span>Traffic lights</h3><p><span class="pill-st green">On target</span> met the target; <span class="pill-st amber">Close</span> within 10% of it; <span class="pill-st red">Missed</span> more than 10% away. "&ge;" means at least, "&le;" means at most.</p><p class="why">Board members see immediately which promises were kept.</p></div>'+
   '<div class="hcard"><h3><span class="no">B</span>The 12 KPIs</h3><p>Grouped by pillar: clinical quality (audit score, % audits &ge; 90%), safety (critical errors, High tickets), experience (Medium tickets, fulfilment, genuine cancellations), responsiveness (answered and resolved within deadline, overdue pending) and governance (audit coverage, leads completed).</p><p class="why">Each KPI can be given an owner and a monthly target.</p></div>'+
   '<div class="hcard"><h3><span class="no">C</span>Trend line</h3><p>The small line shows each KPI month by month (August onward), so you can see if a red KPI is improving or getting worse.</p><p class="why">Direction matters as much as today\'s colour.</p></div>'
});

</script>
</body>
</html>
